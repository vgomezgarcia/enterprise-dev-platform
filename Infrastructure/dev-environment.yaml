AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Enterprise DEV/TEST environment created with AWS CloudFormation.
  Creates a VPC, public subnet, Internet Gateway, route table,
  Security Group, IAM Role, Instance Profile, and Amazon Linux 2023
  EC2 Apache web server.
  EC2 downloads versioned Apache configuration and application
  artifacts automatically from Amazon S3.
  AWS Systems Manager Session Manager is used instead of SSH.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------

  EnvironmentName:
    Type: String
    Default: DEV

    AllowedValues:
      - DEV
      - TEST

    Description: Environment name.


  # ----------------------------------------------------------
  # EC2 INSTANCE TYPE
  # ----------------------------------------------------------

  InstanceType:
    Type: String
    Default: t3.micro

    AllowedValues:
      - t3.micro
      - t3.small

    Description: EC2 instance type.


  # ----------------------------------------------------------
  # AMAZON LINUX 2023 AMI
  # ----------------------------------------------------------

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>

    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

    Description: Latest Amazon Linux 2023 AMI.


  # ----------------------------------------------------------
  # S3 ARTIFACT BUCKET
  #
  # Example:
  # enterprise-dev-artifacts
  # ----------------------------------------------------------

  ArtifactBucketName:
    Type: String

    Default: enterprise-dev-artifacts

    Description: >
      S3 bucket containing approved Apache configuration
      and application artifacts.


  # ----------------------------------------------------------
  # APPLICATION RELEASE
  #
  # Examples:
  #
  # v1.0.0
  # v1.0.1
  # v2.1.0
  #
  # EC2 will download:
  #
  # releases/v1.0.0/httpd.conf
  # releases/v1.0.0/index.html
  # ----------------------------------------------------------

  ReleaseVersion:
    Type: String

    Default: v1.0.0

    AllowedPattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

    ConstraintDescription: >
      ReleaseVersion must use semantic version format such as v1.0.0.

    Description: >
      Version of the Apache configuration and application
      artifacts to deploy.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # VPC
  # ==========================================================

  DevVPC:
    Type: AWS::EC2::VPC

    Properties:

      CidrBlock: 10.10.0.0/16

      EnableDnsSupport: true

      EnableDnsHostnames: true

      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-VPC"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # INTERNET GATEWAY
  # ==========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:

      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-IGW"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # INTERNET GATEWAY ATTACHMENT
  # ==========================================================

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:

      VpcId: !Ref DevVPC

      InternetGatewayId: !Ref InternetGateway


  # ==========================================================
  # PUBLIC SUBNET
  # ==========================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:

      VpcId: !Ref DevVPC

      CidrBlock: 10.10.1.0/24

      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-Public-Subnet"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # PUBLIC ROUTE TABLE
  # ==========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:

      VpcId: !Ref DevVPC

      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-Public-RT"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # DEFAULT INTERNET ROUTE
  # ==========================================================

  DefaultRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - AttachGateway

    Properties:

      RouteTableId: !Ref PublicRouteTable

      DestinationCidrBlock: 0.0.0.0/0

      GatewayId: !Ref InternetGateway


  # ==========================================================
  # SUBNET / ROUTE TABLE ASSOCIATION
  # ==========================================================

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      SubnetId: !Ref PublicSubnet

      RouteTableId: !Ref PublicRouteTable


  # ==========================================================
  # SECURITY GROUP
  #
  # No SSH port 22 is opened.
  #
  # Administration is performed through:
  #
  # AWS Systems Manager Session Manager
  # ==========================================================

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Allow HTTP traffic to DEV TEST web server

      VpcId: !Ref DevVPC


      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0


      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-Web-SG"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # EC2 IAM ROLE
  #
  # Responsibilities:
  #
  # 1. Systems Manager / Session Manager.
  # 2. Read approved release artifacts from S3.
  #
  # No AWS access keys are stored on EC2.
  # ==========================================================

  WebServerRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole


      # ------------------------------------------------------
      # SYSTEMS MANAGER
      # ------------------------------------------------------

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


      # ------------------------------------------------------
      # S3 LEAST-PRIVILEGE ACCESS
      # ------------------------------------------------------

      Policies:

        - PolicyName: EnterpriseDevArtifactsReadAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # ------------------------------------------------
              # LIST APPROVED RELEASES
              # ------------------------------------------------

              - Sid: ListApprovedReleases

                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}"

                Condition:

                  StringLike:

                    s3:prefix:
                      - "releases/*"


              # ------------------------------------------------
              # DOWNLOAD APPROVED RELEASE OBJECTS
              # ------------------------------------------------

              - Sid: ReadApprovedArtifacts

                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}/releases/*"


      Tags:

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # IAM INSTANCE PROFILE
  #
  # Role
  #   ↓
  # Instance Profile
  #   ↓
  # EC2
  # ==========================================================

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      Roles:
        - !Ref WebServerRole


  # ==========================================================
  # EC2 WEB SERVER
  # ==========================================================

  WebServer:
    Type: AWS::EC2::Instance


    # --------------------------------------------------------
    # Wait for Internet routing before EC2 is created.
    # --------------------------------------------------------

    DependsOn:

      - DefaultRoute

      - PublicSubnetRouteTableAssociation


    Properties:


      # ------------------------------------------------------
      # INSTANCE CONFIGURATION
      # ------------------------------------------------------

      InstanceType: !Ref InstanceType

      ImageId: !Ref LatestAmiId

      SubnetId: !Ref PublicSubnet


      # ------------------------------------------------------
      # IAM INSTANCE PROFILE
      # ------------------------------------------------------

      IamInstanceProfile: !Ref WebServerInstanceProfile


      # ------------------------------------------------------
      # SECURITY GROUP
      # ------------------------------------------------------

      SecurityGroupIds:

        - !Ref WebSecurityGroup


      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub "${EnvironmentName}-Web-Server"

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: AutoShutdown
          Value: "true"

        - Key: ReleaseVersion
          Value: !Ref ReleaseVersion

        - Key: ManagedBy
          Value: CloudFormation


      # ======================================================
      # USER DATA
      #
      # Runs during first boot of a NEW EC2 instance.
      #
      # EC2 downloads:
      #
      # releases/${ReleaseVersion}/httpd.conf
      # releases/${ReleaseVersion}/index.html
      #
      # Improvements:
      #
      # - strict Bash error handling
      # - centralized logging
      # - S3 download retries
      # - Apache configuration validation
      # - runtime verification
      # ======================================================

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

          echo "=================================================="
          echo "Starting ${EnvironmentName} deployment"
          echo "Artifact Bucket: ${ArtifactBucketName}"
          echo "Release Version: ${ReleaseVersion}"
          echo "=================================================="


          # ==================================================
          # WAIT FOR NETWORK INITIALIZATION
          # ==================================================

          echo "Waiting for network initialization..."

          sleep 20


          # ==================================================
          # VERIFY INSTANCE IDENTITY / IAM
          # ==================================================

          echo "Checking AWS CLI..."

          aws --version


          echo "Checking EC2 IAM identity..."

          aws sts get-caller-identity


          # ==================================================
          # INSTALL APACHE
          # ==================================================

          echo "Installing Apache HTTP Server..."

          dnf install -y httpd


          # ==================================================
          # VERIFY APACHE PACKAGE
          # ==================================================

          echo "Verifying Apache installation..."

          rpm -q httpd


          # ==================================================
          # S3 DOWNLOAD FUNCTION
          #
          # Retry each download up to 5 times.
          # This protects bootstrap against temporary network
          # or S3 connectivity delays during first boot.
          # ==================================================

          download_s3_object() {

            SOURCE_URI="$1"

            DESTINATION="$2"

            ATTEMPT=1

            MAX_ATTEMPTS=5


            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

              echo "Download attempt $ATTEMPT of $MAX_ATTEMPTS"

              echo "Source: $SOURCE_URI"

              echo "Destination: $DESTINATION"


              if aws s3 cp "$SOURCE_URI" "$DESTINATION"; then

                echo "Download completed successfully."

                return 0

              fi


              echo "Download attempt $ATTEMPT failed."

              ATTEMPT=$((ATTEMPT + 1))


              if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then

                echo "Waiting 10 seconds before retry..."

                sleep 10

              fi

            done


            echo "ERROR: Unable to download $SOURCE_URI"

            return 1
          }


          # ==================================================
          # DOWNLOAD APACHE CONFIGURATION
          # ==================================================

          echo "Downloading Apache configuration..."

          download_s3_object \
            "s3://${ArtifactBucketName}/releases/${ReleaseVersion}/httpd.conf" \
            "/etc/httpd/conf/httpd.conf"


          # ==================================================
          # DOWNLOAD APPLICATION
          # ==================================================

          echo "Downloading application..."

          download_s3_object \
            "s3://${ArtifactBucketName}/releases/${ReleaseVersion}/index.html" \
            "/var/www/html/index.html"


          # ==================================================
          # VERIFY DOWNLOADED FILES
          # ==================================================

          echo "Verifying downloaded files..."

          test -s /etc/httpd/conf/httpd.conf

          test -s /var/www/html/index.html


          echo "Downloaded files verified."


          # ==================================================
          # FILE INFORMATION
          # ==================================================

          echo "Apache configuration file:"

          ls -lh /etc/httpd/conf/httpd.conf


          echo "Application file:"

          ls -lh /var/www/html/index.html


          # ==================================================
          # VALIDATE APACHE CONFIGURATION
          #
          # Apache will not be restarted if httpd.conf
          # contains a syntax error.
          # ==================================================

          echo "Validating Apache configuration..."

          apachectl configtest


          # ==================================================
          # SYSTEMD
          # ==================================================

          echo "Reloading systemd..."

          systemctl daemon-reload


          # ==================================================
          # ENABLE APACHE AT BOOT
          # ==================================================

          echo "Enabling Apache at boot..."

          systemctl enable httpd


          # ==================================================
          # START / RESTART APACHE
          # ==================================================

          echo "Starting Apache..."

          systemctl restart httpd


          # ==================================================
          # VERIFY ENABLED STATE
          # ==================================================

          echo "Checking Apache boot configuration..."

          systemctl is-enabled httpd


          # ==================================================
          # VERIFY ACTIVE STATE
          # ==================================================

          echo "Checking Apache runtime state..."

          systemctl is-active httpd


          # ==================================================
          # VERIFY TCP PORT 80
          # ==================================================

          echo "Checking TCP port 80..."

          ss -lntp | grep ':80'


          # ==================================================
          # LOCAL HTTP TEST
          # ==================================================

          echo "Testing Apache locally..."

          sleep 3

          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost/ \
            > /dev/null


          # ==================================================
          # FINAL VERIFICATION
          # ==================================================

          echo "Apache local HTTP test succeeded."


          echo "=================================================="
          echo "${EnvironmentName} deployment completed successfully"
          echo "Release: ${ReleaseVersion}"
          echo "=================================================="


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ----------------------------------------------------------
  # VPC
  # ----------------------------------------------------------

  VpcId:

    Description: VPC ID

    Value: !Ref DevVPC


  # ----------------------------------------------------------
  # PUBLIC SUBNET
  # ----------------------------------------------------------

  PublicSubnetId:

    Description: Public subnet ID

    Value: !Ref PublicSubnet


  # ----------------------------------------------------------
  # SECURITY GROUP
  # ----------------------------------------------------------

  WebSecurityGroupId:

    Description: Web Security Group ID

    Value: !Ref WebSecurityGroup


  # ----------------------------------------------------------
  # EC2 IAM ROLE
  # ----------------------------------------------------------

  WebServerRoleName:

    Description: IAM Role used by the EC2 web server

    Value: !Ref WebServerRole


  # ----------------------------------------------------------
  # INSTANCE PROFILE
  # ----------------------------------------------------------

  WebServerInstanceProfileName:

    Description: EC2 IAM Instance Profile

    Value: !Ref WebServerInstanceProfile


  # ----------------------------------------------------------
  # EC2 INSTANCE
  # ----------------------------------------------------------

  EC2InstanceId:

    Description: EC2 Instance ID

    Value: !Ref WebServer


  # ----------------------------------------------------------
  # PUBLIC IPV4
  # ----------------------------------------------------------

  PublicIP:

    Description: EC2 public IPv4 address

    Value: !GetAtt WebServer.PublicIp


  # ----------------------------------------------------------
  # PUBLIC DNS
  # ----------------------------------------------------------

  PublicDNS:

    Description: EC2 public DNS hostname

    Value: !GetAtt WebServer.PublicDnsName


  # ----------------------------------------------------------
  # WEBSITE
  # ----------------------------------------------------------

  WebsiteURL:

    Description: Apache website URL

    Value: !Sub "http://${WebServer.PublicDnsName}"


  # ----------------------------------------------------------
  # DEPLOYED RELEASE
  # ----------------------------------------------------------

  DeployedRelease:

    Description: Artifact release deployed to EC2

    Value: !Ref ReleaseVersion


  # ----------------------------------------------------------
  # ARTIFACT BUCKET
  # ----------------------------------------------------------

  ArtifactBucket:

    Description: S3 artifact bucket used by EC2

    Value: !Ref ArtifactBucketName